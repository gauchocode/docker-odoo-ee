services:
  postgres:
    image: ${PG_IMAGE:-postgres}:${PG_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-odoo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-odoo}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${PG_PATH:-./postgresql}:/var/lib/postgresql/data
    networks:
      - network

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ODOO_IMAGE:-odoo-ee}:${ODOO_VERSION:-19.0}
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LP_PORT:-8072}:8072"
    volumes:
      - ${DATA_PATH:-./datadir}:/var/lib/odoo
      - ${CUSTOM_ADDONS:-./addons}:/mnt/extra-addons
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${PG_USER:-odoo}
      PASSWORD: ${PG_PASSWORD:-odoo}
    networks:
      - network

networks:
  network:
